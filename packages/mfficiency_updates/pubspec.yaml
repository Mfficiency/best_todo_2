name: mfficiency_updates
description: >-
  In-app updates from GitHub Releases for the Mfficiency Flutter apps: silent
  download, Android's own install dialog, rollback to older versions, and a
  full backup to Downloads before every update.
version: 1.6.2
publish_to: 'none'

# The lowest constraint of the apps that vendor this package.
environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

# Only packages every app already depends on.
dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: ch.mfficiency.updates
        pluginClass: MfficiencyUpdatesPlugin
