name: Update Screenshot Changelog

on:
  push:
    branches: [main, staging, dev]
    paths-ignore:
      - 'SCREENSHOT_CHANGELOG.md'
      - 'docs/screenshots/home/**'
      - 'docs/ci/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshot-changelog:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip-screenshot-changelog]')
    # windows-latest moved to an image with Visual Studio 2026 (June 2026).
    # Flutter <3.35 only knows the VS 2022 CMake generator (VS 18 falls back
    # to the VS 2019 generator, which fails), so pin the VS 2022 image.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.22's Windows build requires the VS 2019 CMake generator, which
          # windows-latest no longer ships (broke silently in June 2026).
          # Keep in sync with flutter_test.yml.
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Capture home page screenshot
        shell: pwsh
        run: |
          flutter test integration_test/home_page_screenshot_test.dart -d windows *>&1 | Tee-Object -FilePath capture_output.log
          exit $LASTEXITCODE

      # The capture broke silently for weeks because job logs need auth to
      # read. On failure, commit the test output into the repo so it can be
      # inspected (and fixed) without GitHub credentials.
      - name: Publish capture failure log
        if: failure()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          New-Item -ItemType Directory -Force docs/ci | Out-Null
          # .txt, not .log — the repo gitignores *.log, which made git add a
          # silent no-op the first time around. -f as belt and braces.
          Copy-Item capture_output.log docs/ci/screenshot_capture_failure.txt -Force
          git add -f docs/ci/screenshot_capture_failure.txt
          git commit -m "ci: record screenshot capture failure log [skip-screenshot-changelog]"
          git pull --rebase origin ${{ github.ref_name }}
          git push

      - name: Save screenshot in repo
        id: screenshot_meta
        shell: pwsh
        run: |
          $targetDir = "docs/screenshots/home"
          New-Item -ItemType Directory -Path $targetDir -Force | Out-Null

          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $shortSha = "${{ github.sha }}".Substring(0, 7)
          $folderName = "$timestamp-$shortSha"
          $targetFolderPath = Join-Path $targetDir $folderName
          New-Item -ItemType Directory -Path $targetFolderPath -Force | Out-Null

          # Copy every captured page so newly added screenshots are archived
          # without editing this workflow.
          Copy-Item "build/e2e_screenshots/*.png" $targetFolderPath -Force

          "screenshot_folder=$targetDir/$folderName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Update screenshot changelog
        run: >
          dart run tool/update_screenshot_changelog.dart
          --screenshot-folder "${{ steps.screenshot_meta.outputs.screenshot_folder }}"
          --branch "${{ github.ref_name }}"
          --source-sha "${{ github.sha }}"

      - name: Commit and push changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A green run supersedes any published failure log.
          if (Test-Path docs/ci/screenshot_capture_failure.txt) {
            git rm -f docs/ci/screenshot_capture_failure.txt
          }
          git add SCREENSHOT_CHANGELOG.md docs/screenshots/home

          if (git diff --cached --quiet) {
            Write-Output "No screenshot changelog changes to commit."
            exit 0
          }

          git commit -m "chore: update home screenshot changelog [skip-screenshot-changelog]"
          git push
