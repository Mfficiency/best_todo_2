name: Obsidian Plugin

# The obsidian-plugin/ folder is its own npm package (not part of the Flutter
# build), so it gets its own job: contract tests + a production bundle.
on:
  push:
    branches: [main, staging, dev]
    paths:
      - 'obsidian-plugin/**'
      - '.github/workflows/obsidian_plugin.yml'
  pull_request:
    branches: [main, staging, dev]
    paths:
      - 'obsidian-plugin/**'
      - '.github/workflows/obsidian_plugin.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: obsidian-plugin

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: obsidian-plugin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build bundle
        run: npm run build

      - name: Upload plugin bundle
        uses: actions/upload-artifact@v4
        with:
          name: besttodo-tasks-plugin
          path: |
            obsidian-plugin/manifest.json
            obsidian-plugin/main.js
            obsidian-plugin/styles.css
