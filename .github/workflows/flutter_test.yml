name: Run Flutter Tests

on:
  push:
    branches: [main, staging, dev]
    # The steps below publish the run's own report back into the repo; ignore
    # those bot commits here so they can't re-trigger this workflow in a loop.
    paths-ignore:
      - 'assets/test_report.json'
      - 'docs/ci/**'
  pull_request:
    branches: [main, staging, dev]

permissions:
  contents: write

jobs:
  test:
    name: Flutter Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: appver
        shell: bash
        run: echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      # One run, machine-readable: the app's report and the human summary below
      # are both rendered from this stream, so they can never disagree.
      - name: Run tests
        id: flutter_test
        shell: bash
        run: |
          set +e
          flutter test --machine --coverage > test_machine_output.jsonl
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Parse results into a test report
        if: always()
        shell: bash
        run: |
          mkdir -p build/ci
          dart run tool/generate_test_report.dart \
            --input test_machine_output.jsonl \
            --output build/ci/test_report.json \
            --commit "${GITHUB_SHA:0:9}" \
            --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
            --version "${{ steps.appver.outputs.version }}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      # Keep the report that ships inside builds pointed at the newest run known
      # — this run, or a newer one another branch already published.
      - name: Package the newest report into assets
        if: always()
        shell: bash
        run: |
          dart run tool/sync_test_report.dart \
            --candidate build/ci/test_report.json \
            --output assets/test_report.json

      - name: Render job summary
        if: always()
        shell: bash
        run: |
          dart run tool/render_test_report_summary.dart \
            --report build/ci/test_report.json \
            --machine test_machine_output.jsonl \
            --out flutter_test_report.md

      - name: Upload test artifacts
        id: upload_test_artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-report
          path: |
            flutter_test_report.md
            build/ci/test_report.json
            test_machine_output.jsonl
          if-no-files-found: warn

      - name: Add artifact download link to summary
        if: always()
        shell: bash
        run: |
          if [ -n "${{ steps.upload_test_artifacts.outputs.artifact-url }}" ]; then
            echo "### Download" >> "$GITHUB_STEP_SUMMARY"
            echo "- [Download flutter-test-report artifact](${{ steps.upload_test_artifacts.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Every branch's run lands in the shared `ci-reports` store, so "latest
      # results" is branch-independent for builds and for installed apps.
      - name: Publish report to the ci-reports store
        if: always() && github.event_name == 'push'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash tool/ci/publish_test_report.sh build/ci/test_report.json "${GITHUB_REF_NAME}"

      # dev is the single branch whose history carries the packaged report, so
      # dev → staging → main merges just carry it along instead of conflicting.
      # A checkout of dev therefore has real results offline — no network, no
      # build step needed (this is what makes `flutter run -d chrome` useful).
      - name: Commit the packaged report on dev
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs/ci
          # docs/ci copy kept for app versions before 0.1.127, which fetch it.
          cp assets/test_report.json docs/ci/test_report.json
          git add assets/test_report.json docs/ci/test_report.json
          if git diff --cached --quiet; then
            echo "Packaged report unchanged."
            exit 0
          fi
          git commit -m "ci: package latest test report [skip-screenshot-changelog]"
          for attempt in 1 2 3; do
            git pull --rebase origin dev && git push origin "HEAD:dev" && exit 0
            echo "Push attempt $attempt failed; retrying."
            sleep $((attempt * 3))
          done
          echo "Could not commit the packaged report; continuing."

      - name: Fail workflow if tests failed
        if: always() && steps.flutter_test.outputs.exit_code != '0'
        run: exit 1
