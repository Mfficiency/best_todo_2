name: Build Windows Portable Exe

# Runs after a successful APK workflow so every pushed local release build also
# gets a portable Windows artifact. It can still be run manually from Actions
# when a fresh zip is wanted without cutting an APK.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
    branches: [main, staging, dev]

permissions:
  contents: read

jobs:
  build:
    name: Build Windows portable zip
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    # windows-latest moved to an image with Visual Studio 2026 (June 2026).
    # Flutter <3.35 only knows the VS 2022 CMake generator (VS 18 falls back
    # to the VS 2019 generator, which fails), so pin the VS 2022 image — same
    # pin as screenshot_changelog.yml.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          # For APK-triggered runs, build exactly the same commit that produced
          # the APK. Manual runs fall back to the selected workflow ref.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with flutter_test.yml / screenshot_changelog.yml.
          flutter-version: '3.29.2'
          channel: 'stable'

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Read app version
        id: appver
        shell: bash
        run: echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Build Windows release
        run: flutter build windows --release

      # "Portable" here means: no installer, no registry writes, no admin
      # rights — just the Release folder (exe + bundled DLLs + flutter_assets)
      # zipped up so it can be unzipped and run in place on Windows 10 or 11
      # (both supported targets of Flutter's Win32 desktop embedder).
      - name: Package portable zip
        id: package
        shell: pwsh
        run: |
          $ver = "${{ steps.appver.outputs.version }}"
          $releaseDir = "build/windows/x64/runner/Release"
          $stageName = "BestToDo-$ver-portable-win64"
          $stageDir = "build/windows/$stageName"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Copy-Item "$releaseDir/*" $stageDir -Recurse
          $zipPath = "build/windows/$stageName.zip"
          Compress-Archive -Path $stageDir -DestinationPath $zipPath -Force
          "zip_path=$zipPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "zip_name=$stageName.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Add download link to summary
        shell: bash
        run: |
          echo "### Windows portable build" >> "$GITHUB_STEP_SUMMARY"
          echo "Unzip ${{ steps.package.outputs.zip_name }} anywhere and run BestToDo.exe — no installer needed. Works on Windows 10 and 11 (x64)." >> "$GITHUB_STEP_SUMMARY"
