name: Build APK

on:
  push:
    branches: [ main, claude/todo-chronize-point-XjpG4 ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Build APK
      run: flutter build apk --release

    - name: Prepare versioned APK
      id: apk
      run: |
        VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//')
        SAFE=${VERSION/+/-}
        APK="BestToDo-${VERSION}.apk"
        cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${APK}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "tag=v${SAFE}" >> "$GITHUB_OUTPUT"
        echo "apk=$APK" >> "$GITHUB_OUTPUT"
        echo "apk_path=build/app/outputs/flutter-apk/${APK}" >> "$GITHUB_OUTPUT"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: BestToDo-${{ steps.apk.outputs.version }}
        path: ${{ steps.apk.outputs.apk_path }}
        retention-days: 30

    - name: Publish APK to GitHub Release
      if: github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.apk.outputs.tag }}
        name: BestToDo ${{ steps.apk.outputs.version }}
        files: ${{ steps.apk.outputs.apk_path }}
        fail_on_unmatched_files: true
