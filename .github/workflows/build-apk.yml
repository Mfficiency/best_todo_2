name: Build APK

on:
  push:
    branches: [ main, dev ]
    # The publish step below commits docs/ci/test_report.json back to the
    # branch; ignore it here so that bot commit doesn't re-trigger the build
    # in an endless loop (the report's timestamp changes every run).
    paths-ignore:
      - 'docs/ci/**'
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.2'
        channel: 'stable'
        cache: true

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Read app version
      id: appver
      shell: bash
      run: echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

    # Run the tests and embed their results into the APK as
    # assets/test_report.json. A failing test run does NOT block the build —
    # the app shows a red dot on the drawer icon and lists the failures on
    # its Test Results page instead.
    - name: Run tests and embed report into build
      shell: bash
      run: |
        set +e
        flutter test --machine > test_machine_output.jsonl 2>/dev/null
        echo "flutter test exit code: $?"
        set -e
        dart run tool/generate_test_report.dart \
          --input test_machine_output.jsonl \
          --output assets/test_report.json \
          --commit "${GITHUB_SHA:0:9}" \
          --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
          --version "${{ steps.appver.outputs.version }}"

    # Publish the same report the APK bundles to a committed path the app can
    # fetch over the network (see TestReportService.onlineReportUrl), so an
    # installed build can show the latest CI results even when it's older than
    # HEAD. Push events only — PR builds can't (and shouldn't) push.
    - name: Publish test report for the app to pull online
      if: github.event_name == 'push'
      shell: bash
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        mkdir -p docs/ci
        cp assets/test_report.json docs/ci/test_report.json
        git add docs/ci/test_report.json
        if git diff --cached --quiet; then
          echo "No test report change to publish."
          exit 0
        fi
        git commit -m "ci: publish test report [skip-screenshot-changelog]"
        git pull --rebase origin "${GITHUB_REF_NAME}"
        git push origin "HEAD:${GITHUB_REF_NAME}"

    - name: Build APK
      run: flutter build apk --release

    - name: Stage APK with version in filename
      id: stage_apk
      shell: bash
      run: |
        ver="${{ steps.appver.outputs.version }}"
        src="build/app/outputs/flutter-apk/app-release.apk"
        out="build/app/outputs/flutter-apk/besttodo-${ver}.apk"
        cp "$src" "$out"
        echo "apk=$out" >> "$GITHUB_OUTPUT"

    - name: Upload APK
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: besttodo-${{ steps.appver.outputs.version }}
        path: ${{ steps.stage_apk.outputs.apk }}
        if-no-files-found: error
        retention-days: 30

    - name: Add APK download link to summary
      if: always()
      shell: bash
      run: |
        if [ -n "${{ steps.upload_apk.outputs.artifact-url }}" ]; then
          echo "### APK Download" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Download app-release-apk artifact](${{ steps.upload_apk.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
        fi
