name: Build APK

on:
  push:
    # staging builds too, so an APK cut from any branch of the flow carries the
    # latest test results (see the sync step below).
    branches: [ main, staging, dev ]
    # The test workflow commits the packaged report back to dev; ignore those
    # bot commits here so they don't re-trigger a build in an endless loop
    # (the report's timestamp changes every run).
    paths-ignore:
      - 'assets/test_report.json'
      - 'docs/ci/**'
      # The build_music_apk job below commits its staged APK here; without
      # this, that commit's own push would retrigger this whole workflow.
      - 'github_releases/**'
  pull_request:
    branches: [ main, staging, dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.2'
        channel: 'stable'
        cache: true

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Read app version
      id: appver
      shell: bash
      run: echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

    # Run the tests and embed their results into the APK as
    # assets/test_report.json. A failing test run does NOT block the build —
    # the app shows a red dot on the drawer icon and lists the failures on
    # its Test Results page instead.
    - name: Run tests
      shell: bash
      run: |
        set +e
        flutter test --machine > test_machine_output.jsonl 2>/dev/null
        echo "flutter test exit code: $?"
        set -e
        mkdir -p build/ci
        dart run tool/generate_test_report.dart \
          --input test_machine_output.jsonl \
          --output build/ci/test_report.json \
          --commit "${GITHUB_SHA:0:9}" \
          --branch "${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}" \
          --version "${{ steps.appver.outputs.version }}" \
          --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

    # Package the newest run known into the APK: this build's own run, or a newer
    # one published from another branch. This is what makes the Test Results page
    # useful in an APK cut from any branch, with no network on the device.
    - name: Package the newest test report into the APK
      shell: bash
      run: |
        dart run tool/sync_test_report.dart \
          --candidate build/ci/test_report.json \
          --output assets/test_report.json

    # Share this run through the branch-independent `ci-reports` store, so other
    # branches' builds and already-installed apps can pick it up.
    - name: Publish report to the ci-reports store
      if: github.event_name == 'push'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        bash tool/ci/publish_test_report.sh build/ci/test_report.json "${GITHUB_REF_NAME}"

    # `--flavor todo` builds BestToDo itself (android/app/build.gradle.kts
    # also defines a `music` flavor for the separate Best Music app —
    # lib/main_music.dart — built locally via `sh tool/build.sh music-apk`,
    # not by this workflow).
    - name: Build APK
      run: flutter build apk --release --flavor todo

    - name: Stage APK with version in filename
      id: stage_apk
      shell: bash
      run: |
        ver="${{ steps.appver.outputs.version }}"
        src="build/app/outputs/flutter-apk/app-todo-release.apk"
        out="build/app/outputs/flutter-apk/besttodo-${ver}.apk"
        cp "$src" "$out"
        echo "apk=$out" >> "$GITHUB_OUTPUT"

    - name: Upload APK
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: besttodo-${{ steps.appver.outputs.version }}
        path: ${{ steps.stage_apk.outputs.apk }}
        if-no-files-found: error
        retention-days: 30

    # Publish the APK as a GitHub release, which is where the About page
    # "Check for updates" button looks (UpdateService reads releases/latest and
    # needs an .apk asset there). Same tool as a local publish, so the tag,
    # release name, asset name and CHANGELOG body stay identical; it reuses an
    # existing release for the version and replaces its asset, so re-running
    # across dev/staging/main for one version is safe.
    - name: Publish APK to a GitHub release
      if: github.event_name == 'push'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dart run tool/publish_apk.dart --apk "${{ steps.stage_apk.outputs.apk }}"

    - name: Add APK download link to summary
      if: always()
      shell: bash
      run: |
        if [ -n "${{ steps.upload_apk.outputs.artifact-url }}" ]; then
          echo "### APK Download" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Download app-release-apk artifact](${{ steps.upload_apk.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
        fi

  # Best Music (SPEC.md §10.6f, lib/main_music.dart): a separate app from this
  # same codebase, its own Android build flavor. Runs independently of the
  # `build` job above (no shared state needed) and, on a push, stages its APK
  # into github_releases/ the same way a local `sh tool/build.sh music-apk
  # --release` would — that folder is UpdateService's primary (and, for a
  # non-`best_todo` app, only) update-check source, deliberately not a GitHub
  # Release: see UpdateService.checkReleases's doc comment for why a shared
  # repo-wide `releases/latest` isn't safe to use for a second app.
  build_music_apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.29.2'
        channel: 'stable'
        cache: true

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Read app version
      id: appver
      shell: bash
      run: echo "version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

    - name: Build Best Music APK
      run: flutter build apk --release --flavor music -t lib/main_music.dart

    - name: Stage APK with version in filename
      id: stage_apk
      shell: bash
      run: |
        src="build/app/outputs/flutter-apk/app-music-release.apk"
        out="build/app/outputs/flutter-apk/bestmusic-${{ steps.appver.outputs.version }}.apk"
        cp "$src" "$out"
        echo "apk=$out" >> "$GITHUB_OUTPUT"

    - name: Upload APK
      id: upload_apk
      uses: actions/upload-artifact@v4
      with:
        name: bestmusic-${{ steps.appver.outputs.version }}
        path: ${{ steps.stage_apk.outputs.apk }}
        if-no-files-found: error
        retention-days: 30

    # Keeps github_releases/ at Best Music's own newest two builds (pruned
    # independently of BestToDo's — see tool/stage_local_release.dart's
    # --prefix), then commits+pushes so the folder the app actually reads is
    # live. Only on a real push (not a PR, which shouldn't push commits back).
    - name: Stage into github_releases/ and push
      if: github.event_name == 'push'
      shell: bash
      run: |
        dart run tool/stage_local_release.dart \
          --apk "build/app/outputs/flutter-apk/app-music-release.apk" \
          --prefix best_music
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add github_releases
        if git diff --cached --quiet; then
          echo "nothing to commit (github_releases/ already up to date)"
          exit 0
        fi
        git commit -m "chore: stage Best Music release build ${{ steps.appver.outputs.version }} [ci]"
        # The `build` job's own release publish and other same-branch CI runs
        # can land around the same time (a plain push has lost this race on
        # dev before — see screenshot_changelog.yml) — rebase-and-retry.
        for attempt in 1 2 3; do
          git pull --rebase origin "${GITHUB_REF_NAME}"
          if git push origin "HEAD:${GITHUB_REF_NAME}"; then
            exit 0
          fi
          echo "Push attempt $attempt failed; retrying."
          sleep $((attempt * 3))
        done
        exit 1

    - name: Add APK download link to summary
      if: always()
      shell: bash
      run: |
        if [ -n "${{ steps.upload_apk.outputs.artifact-url }}" ]; then
          echo "### Best Music APK Download" >> "$GITHUB_STEP_SUMMARY"
          echo "- [Download bestmusic-apk artifact](${{ steps.upload_apk.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
        fi
